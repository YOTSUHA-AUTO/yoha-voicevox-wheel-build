name: Fixed pyopenjtalk Windows wheel
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-wheel-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'YOTSUHA-AUTO/yoha-voicevox-wheel-build' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: VOICEVOX/pyopenjtalk
          ref: 74703b034dd90a1f199f49bb70bf3b66b1728a86
          path: upstream
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
          check-latest: false
      - name: Build without importing package or starting any engine
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/provenance.json
            dist/SHA256SUMS
          retention-days: 3
          if-no-files-found: error
  attest:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.whl
            dist/provenance.json
            dist/SHA256SUMS
          show-summary: false
          push-to-registry: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 3
          if-no-files-found: error
